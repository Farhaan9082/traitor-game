<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Role Reveal Screen</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#4f30e8",
                "background-light": "#f6f6f8",
                "background-dark": "#141121",
                },
                fontFamily: {
                "display": ["Space Grotesk", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                animation: {
                    'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                }
            },
            },
        }
    </script>
<style>
        /* Custom utilities for 3D Flip */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-display antialiased selection:bg-primary/30 selection:text-white">
<!-- Mobile Container Simulation -->
<div class="relative w-full max-w-[420px] h-full min-h-screen lg:min-h-[850px] lg:h-auto bg-[#121118] lg:rounded-[2rem] lg:border-[8px] lg:border-[#2b2938] lg:shadow-2xl overflow-hidden flex flex-col">
<!-- Ambient Background Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-primary/20 blur-[100px] rounded-full pointer-events-none opacity-50"></div>
<!-- Header -->
<header class="relative z-10 flex items-center justify-between px-6 py-5 border-b border-white/5 bg-[#121118]/80 backdrop-blur-md">
<div class="flex items-center gap-3 text-white">
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">theater_comedy</span>
<h2 class="text-lg font-bold tracking-tight">Secret Agent</h2>
</div>
<div class="flex items-center gap-2">
<div class="px-2 py-1 rounded bg-white/5 border border-white/10">
<span class="text-xs font-medium text-gray-400">Round 3/5</span>
</div>
<button class="text-gray-400 hover:text-white transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">settings</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col relative z-10 p-6 overflow-y-auto">
<!-- Safety Warning -->
<div class="flex flex-col items-center gap-2 mb-6">
<div class="flex items-center gap-2 text-yellow-500 bg-yellow-500/10 px-3 py-1.5 rounded-full border border-yellow-500/20">
<span class="material-symbols-outlined" style="font-size: 16px;">visibility_off</span>
<span class="text-xs font-bold uppercase tracking-wider">Private Eye Only</span>
</div>
<h1 class="text-white text-center text-xl font-medium leading-snug">
                    Make sure no one is watching <span class="align-middle">👀</span>
</h1>
</div>
<!-- The Flip Card Area -->
<!-- 
                Implementation Note: 
                We use a checkbox hack to simulate the flip state.
                Default is 'checked' to show the Revealed state (Face Up) as per request to design the "Role Reveal Screen".
                Unchecking simulates the "Face Down" state.
            -->
<div class="flex-1 flex items-center justify-center perspective-1000 my-4 group">
<input checked="" class="peer hidden" id="card-flip" type="checkbox"/>
<label class="relative w-full max-w-[320px] aspect-[2/3] cursor-pointer transition-transform duration-700 transform-style-3d peer-checked:rotate-y-180" for="card-flip">
<!-- FACE 1: HIDDEN STATE (Card Back) -->
<!-- This side is visible when NOT checked (0deg) -->
<!-- Since we rotate 180 when checked, this side is effectively the "Front" in DOM order but acts as "Back" visually in revealed state -->
<div class="absolute inset-0 w-full h-full backface-hidden">
<div class="w-full h-full rounded-2xl bg-[#1e1c26] border border-white/10 shadow-xl overflow-hidden flex flex-col items-center justify-center relative">
<!-- Pattern Background -->
<div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary via-[#1e1c26] to-[#1e1c26]"></div>
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-overlay" data-alt="Geometric cube pattern texture"></div>
<!-- Center Content -->
<div class="relative z-10 flex flex-col items-center gap-6 animate-pulse-slow">
<div class="size-20 rounded-full bg-gradient-to-tr from-primary to-purple-400 p-[2px] shadow-[0_0_30px_rgba(79,48,232,0.6)]">
<div class="w-full h-full rounded-full bg-[#121118] flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-size: 40px;">fingerprint</span>
</div>
</div>
<div class="flex flex-col items-center gap-1">
<p class="text-white text-xl font-bold tracking-[0.2em] uppercase">Tap to Reveal</p>
<p class="text-gray-500 text-sm">Secret Role Assignment</p>
</div>
</div>
<!-- Decorative Corners -->
<div class="absolute top-4 left-4 size-3 border-t-2 border-l-2 border-primary/50 rounded-tl-lg"></div>
<div class="absolute top-4 right-4 size-3 border-t-2 border-r-2 border-primary/50 rounded-tr-lg"></div>
<div class="absolute bottom-4 left-4 size-3 border-b-2 border-l-2 border-primary/50 rounded-bl-lg"></div>
<div class="absolute bottom-4 right-4 size-3 border-b-2 border-r-2 border-primary/50 rounded-br-lg"></div>
</div>
</div>
<!-- FACE 2: REVEALED STATE (Card Face) -->
<!-- This side is rotated 180deg initially, so it's hidden. When parent rotates 180, this becomes 360 (visible) -->
<div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180">
<div class="w-full h-full rounded-2xl bg-[#1e1c26] border border-primary/50 shadow-[0_0_40px_-10px_rgba(79,48,232,0.4)] overflow-hidden flex flex-col relative">
<!-- Card Header -->
<div class="p-6 pb-2 text-center relative z-10">
<p class="text-[#a29db8] text-xs font-bold uppercase tracking-widest mb-1">Your Identity</p>
<h2 class="text-white text-4xl font-black uppercase tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-white via-white to-gray-400 drop-shadow-sm">Traitor</h2>
</div>
<!-- Card Image Area -->
<div class="flex-1 relative flex items-center justify-center p-4">
<div class="absolute inset-0 bg-gradient-to-b from-[#1e1c26] via-primary/10 to-[#1e1c26] opacity-60"></div>
<!-- Character Image -->
<div class="relative w-48 h-48 rounded-full border-4 border-[#2b2938] shadow-2xl bg-[#141121] overflow-hidden flex items-center justify-center group-hover:scale-105 transition-transform duration-500">
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="Mystery silhouette character portrait looking menacing" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC5OA8ycTpCrYIfk1fsBu3ZamaPoCtvRJqg2xPVuAv8IGGJM8McDu_G5zERdEmd8jam8fmdE_rMy9Ddk8bOTtX0HEaz08pdUkq6CrMd-6ODYeCK2Ecg5jFCdP7aCI017aJ1ruI7ePdPOxT_K9ic-PwqiBInQS4g7wGGuszki6wMTr109eeh9Xw9RPSCDfzHgJ1XhiSjUa-pUjybu3m2CL8Z9cRt_ErBEVKiG0m8cXNS1ZLvqGDN4bCltAq18bPbgWeivYj8McV27NA');"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
<span class="material-symbols-outlined text-red-500 relative z-10 drop-shadow-[0_2px_10px_rgba(220,38,38,0.8)]" style="font-size: 64px;">domino_mask</span>
</div>
</div>
<!-- Card Content Area -->
<div class="p-6 pt-2 text-center relative z-10 bg-gradient-to-t from-[#141121] via-[#141121] to-transparent">
<div class="bg-white/5 backdrop-blur-sm rounded-xl p-4 border border-white/10 mb-4">
<p class="text-gray-300 text-sm leading-relaxed font-medium">
                                        Eliminate the crew without getting caught. Sabotage the mission.
                                    </p>
</div>
<div class="flex items-center justify-center gap-2 text-primary">
<span class="material-symbols-outlined" style="font-size: 18px;">vpn_key_off</span>
<span class="text-xs font-bold uppercase tracking-widest">Top Secret</span>
</div>
</div>
</div>
</div>
</label>
</div>
<!-- Status & Timer -->
<div class="mt-6 flex flex-col gap-4">
<div class="text-center space-y-1">
<p class="text-white text-lg font-bold animate-pulse">Keep a straight face 😐</p>
<p class="text-[#a29db8] text-sm">Don't let them see you react</p>
</div>
<!-- Progress Bar -->
<div class="bg-[#2b2938] rounded-full h-1.5 w-full overflow-hidden">
<div class="bg-white h-full rounded-full w-[60%] shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
</div>
<div class="flex justify-between items-center text-xs text-[#6e6a7c] font-medium px-1">
<span>Auto-locking card...</span>
<span>3s</span>
</div>
</div>
</main>
<!-- Footer Action -->
<footer class="p-6 pt-2 relative z-10 bg-[#121118]">
<button class="w-full h-14 bg-[#2b2938] text-[#6e6a7c] rounded-xl font-bold text-base tracking-wide flex items-center justify-center gap-2 cursor-not-allowed opacity-80" disabled="">
<span class="material-symbols-outlined" style="font-size: 20px;">lock_clock</span>
                Wait for lock...
            </button>
</footer>
</div>
</body></html>
