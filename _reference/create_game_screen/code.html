<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Game Screen</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4f30e8",
                        "background-light": "#f6f6f8",
                        "background-dark": "#141121",
                        "surface-dark": "#1e1c26",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b2938;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #403c53;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden">
<!-- Background Pattern/Gradient -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none" style="background: radial-gradient(circle at 50% 0%, rgba(79, 48, 232, 0.15) 0%, rgba(20, 17, 33, 0) 60%);"></div>
<!-- Layout Container -->
<div class="layout-container flex h-full grow flex-col z-10">
<!-- Navbar -->
<header class="flex items-center justify-between border-b border-gray-200 dark:border-[#2b2938] px-6 py-4 lg:px-40">
<div class="flex items-center gap-3">
<div class="text-primary size-8">
<svg class="w-full h-full" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M13.8261 30.5736C16.7203 29.8826 20.2244 29.4783 24 29.4783C27.7756 29.4783 31.2797 29.8826 34.1739 30.5736C36.9144 31.2278 39.9967 32.7669 41.3563 33.8352L24.8486 7.36089C24.4571 6.73303 23.5429 6.73303 23.1514 7.36089L6.64374 33.8352C8.00331 32.7669 11.0856 31.2278 13.8261 30.5736Z" fill="currentColor"></path>
<path clip-rule="evenodd" d="M39.998 35.764C39.9944 35.7463 39.9875 35.7155 39.9748 35.6706C39.9436 35.5601 39.8949 35.4259 39.8346 35.2825C39.8168 35.2403 39.7989 35.1993 39.7813 35.1602C38.5103 34.2887 35.9788 33.0607 33.7095 32.5189C30.9875 31.8691 27.6413 31.4783 24 31.4783C20.3587 31.4783 17.0125 31.8691 14.2905 32.5189C12.0012 33.0654 9.44505 34.3104 8.18538 35.1832C8.17384 35.2075 8.16216 35.233 8.15052 35.2592C8.09919 35.3751 8.05721 35.4886 8.02977 35.589C8.00356 35.6848 8.00039 35.7333 8.00004 35.7388C8.00004 35.739 8 35.7393 8.00004 35.7388C8.00004 35.7641 8.0104 36.0767 8.68485 36.6314C9.34546 37.1746 10.4222 37.7531 11.9291 38.2772C14.9242 39.319 19.1919 40 24 40C28.8081 40 33.0758 39.319 36.0709 38.2772C37.5778 37.7531 38.6545 37.1746 39.3151 36.6314C39.9006 36.1499 39.9857 35.8511 39.998 35.764ZM4.95178 32.7688L21.4543 6.30267C22.6288 4.4191 25.3712 4.41909 26.5457 6.30267L43.0534 32.777C43.0709 32.8052 43.0878 32.8338 43.104 32.8629L41.3563 33.8352C43.104 32.8629 43.1038 32.8626 43.104 32.8629L43.1051 32.865L43.1065 32.8675L43.1101 32.8739L43.1199 32.8918C43.1276 32.906 43.1377 32.9246 43.1497 32.9473C43.1738 32.9925 43.2062 33.0545 43.244 33.1299C43.319 33.2792 43.4196 33.489 43.5217 33.7317C43.6901 34.1321 44 34.9311 44 35.7391C44 37.4427 43.003 38.7775 41.8558 39.7209C40.6947 40.6757 39.1354 41.4464 37.385 42.0552C33.8654 43.2794 29.133 44 24 44C18.867 44 14.1346 43.2794 10.615 42.0552C8.86463 41.4464 7.30529 40.6757 6.14419 39.7209C4.99695 38.7775 3.99999 37.4427 3.99999 35.7391C3.99999 34.8725 4.29264 34.0922 4.49321 33.6393C4.60375 33.3898 4.71348 33.1804 4.79687 33.0311C4.83898 32.9556 4.87547 32.8935 4.9035 32.8471C4.91754 32.8238 4.92954 32.8043 4.93916 32.7889L4.94662 32.777L4.95178 32.7688ZM35.9868 29.004L24 9.77997L12.0131 29.004C12.4661 28.8609 12.9179 28.7342 13.3617 28.6282C16.4281 27.8961 20.0901 27.4783 24 27.4783C27.9099 27.4783 31.5719 27.8961 34.6383 28.6282C35.082 28.7342 35.5339 28.8609 35.9868 29.004Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-slate-900 dark:text-white text-xl font-bold leading-tight tracking-tight">Secret Roles</h2>
</div>
<button class="flex items-center justify-center rounded-xl size-10 bg-slate-200 dark:bg-[#2b2938] hover:bg-slate-300 dark:hover:bg-[#403c53] text-slate-700 dark:text-white transition-colors duration-200">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</header>
<!-- Main Content -->
<main class="flex flex-1 justify-center py-8 px-4 overflow-y-auto">
<div class="layout-content-container flex flex-col w-full max-w-[480px] flex-1 gap-6">
<!-- Heading -->
<div class="flex flex-col gap-2 text-center pt-4">
<p class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight">Mission Ready</p>
<p class="text-slate-500 dark:text-[#a29db8] text-base font-normal leading-normal">Room created successfully. Awaiting agents.</p>
</div>
<!-- Game Code Card -->
<div class="flex flex-col items-center justify-center p-8 rounded-2xl bg-white dark:bg-surface-dark shadow-sm border border-slate-200 dark:border-transparent relative overflow-hidden group">
<!-- Glow effect behind code -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-primary/20 blur-[60px] rounded-full"></div>
<span class="text-xs font-bold tracking-[0.2em] text-slate-400 dark:text-slate-500 mb-6 uppercase z-10">Game Code</span>
<!-- The Code Display -->
<div class="flex justify-center gap-2 sm:gap-3 z-10 w-full">
<div class="flex items-center justify-center h-16 w-12 sm:h-20 sm:w-14 rounded-lg bg-slate-50 dark:bg-[#2b2938] border border-slate-200 dark:border-[#403c53] text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white shadow-inner">8</div>
<div class="flex items-center justify-center h-16 w-12 sm:h-20 sm:w-14 rounded-lg bg-slate-50 dark:bg-[#2b2938] border border-slate-200 dark:border-[#403c53] text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white shadow-inner">3</div>
<div class="flex items-center justify-center h-16 w-12 sm:h-20 sm:w-14 rounded-lg bg-slate-50 dark:bg-[#2b2938] border border-slate-200 dark:border-[#403c53] text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white shadow-inner">9</div>
<!-- Spacer -->
<div class="w-1 sm:w-2"></div>
<div class="flex items-center justify-center h-16 w-12 sm:h-20 sm:w-14 rounded-lg bg-slate-50 dark:bg-[#2b2938] border border-slate-200 dark:border-[#403c53] text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white shadow-inner">2</div>
<div class="flex items-center justify-center h-16 w-12 sm:h-20 sm:w-14 rounded-lg bg-slate-50 dark:bg-[#2b2938] border border-slate-200 dark:border-[#403c53] text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white shadow-inner">0</div>
<div class="flex items-center justify-center h-16 w-12 sm:h-20 sm:w-14 rounded-lg bg-slate-50 dark:bg-[#2b2938] border border-slate-200 dark:border-[#403c53] text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white shadow-inner">1</div>
</div>
<div class="flex gap-3 mt-8 z-10 w-full">
<button class="flex-1 flex items-center justify-center gap-2 h-10 rounded-lg bg-slate-100 dark:bg-[#2b2938] hover:bg-slate-200 dark:hover:bg-[#403c53] text-slate-900 dark:text-white text-sm font-bold transition-colors">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
<span>Copy Code</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 h-10 rounded-lg bg-slate-100 dark:bg-[#2b2938] hover:bg-slate-200 dark:hover:bg-[#403c53] text-slate-900 dark:text-white text-sm font-bold transition-colors">
<span class="material-symbols-outlined text-[18px]">share</span>
<span>Share Link</span>
</button>
</div>
</div>
<!-- Helper Text -->
<p class="text-slate-500 dark:text-[#a29db8] text-sm text-center px-4">
                        Share this code with your friends to join the game at <span class="text-primary font-bold">secretroles.app</span>
</p>
<!-- QR Code Card -->
<div class="flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-surface-dark shadow-sm border border-slate-200 dark:border-transparent">
<div class="size-16 shrink-0 rounded-lg bg-white p-1 overflow-hidden" data-alt="QR Code pattern generated based on game link">
<!-- Simulated QR Code using css pattern for simplicity in this output -->
<div class="w-full h-full bg-slate-900" style="background-image:  linear-gradient(45deg, #000 25%, transparent 25%), linear-gradient(-45deg, #000 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #000 75%), linear-gradient(-45deg, transparent 75%, #000 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px;"></div>
</div>
<div class="flex flex-col gap-1 grow">
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight">Scan to Join</p>
<p class="text-slate-500 dark:text-[#a29db8] text-sm font-normal">Players can scan this code to enter the lobby instantly.</p>
</div>
<button class="flex items-center justify-center size-10 rounded-full bg-slate-100 dark:bg-[#2b2938] text-slate-900 dark:text-white hover:bg-slate-200 dark:hover:bg-[#403c53]">
<span class="material-symbols-outlined">qr_code_2</span>
</button>
</div>
<div class="flex-1"></div>
<!-- Footer Action -->
<div class="sticky bottom-0 pb-6 pt-2 bg-background-light dark:bg-background-dark">
<button class="w-full flex items-center justify-center gap-3 h-14 rounded-xl bg-primary hover:bg-primary/90 text-white text-base font-bold shadow-lg shadow-primary/25 transition-all active:scale-[0.98]">
<span>Enter Lobby</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</main>
</div>
</div>
</body></html>
